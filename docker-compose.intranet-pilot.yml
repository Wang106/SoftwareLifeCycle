# Intranet pilot overlay. Use with the base file:
# docker compose -f docker-compose.yml -f docker-compose.intranet-pilot.yml --env-file deploy/intranet-pilot.env up --build
# Fill the env file first. Placeholder values are rejected at API startup.
# This file does not enable business submission switches or the offline operator inside the API process.
services:
  api:
    environment:
      INTRANET_PILOT: "true"
      AUTH_MODE: oidc
      SEED_ON_STARTUP: "false"
      SEED_ZFI_DEMO: "false"
      READ_ONLY_MODE: "false"
      ADMIN_OPERATOR_ENABLED: "false"
      REQUEST_TELEMETRY_ENABLED: "false"
  web:
    environment:
      BROWSER_OIDC_MODE: ${BROWSER_OIDC_MODE:-code}
      BROWSER_SESSION_MODE: ${BROWSER_SESSION_MODE:-encrypted}
      BROWSER_SESSION_ORIGIN: ${BROWSER_SESSION_ORIGIN:-}
      BROWSER_SESSION_KEY: ${BROWSER_SESSION_KEY:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_AUTH: ${OIDC_CLIENT_AUTH:-none}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
