services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-software_lifecycle}
      POSTGRES_USER: ${POSTGRES_USER:-slc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slc_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slc} -d ${POSTGRES_DB:-software_lifecycle}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://slc:slc_dev_password@postgres:5432/software_lifecycle}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
