name: Manual Chrome diagnostic (not acceptance)

# Dispatch only after a separate one-shot owner approval. Never a required check.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved commit SHA (must match this dispatch ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-browser-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Read-only Chrome diagnostic; never browser acceptance
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Require exact approved ref and first attempt
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Diagnose official Chrome read-only; never launch browser
        shell: bash
        run: |
          mkdir -p browser-results
          python3 - <<'PYTHON' | tee browser-results/runner-browser.txt
          import hashlib, json, os, pathlib, platform, plistlib, re, stat, subprocess, urllib.parse, urllib.request

          def output(*args):
              try:
                  return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT).strip()
              except subprocess.CalledProcessError as error:
                  print(error.output or '', end='', flush=True)
                  raise

          assert platform.system() == 'Darwin' and platform.machine() == 'arm64', 'Expected macOS ARM64 runner'
          print('Runner image:', os.environ.get('ImageOS', 'unknown'), os.environ.get('ImageVersion', 'unknown'), flush=True)
          print('OS:', output('/usr/bin/sw_vers', '-productVersion'), '; architecture:', platform.machine(), flush=True)
          # Observe only. Hosted-runner SIP/Gatekeeper state is not modified or mistaken for sandbox proof.
          for command in (('/usr/bin/csrutil', 'status'), ('/usr/sbin/spctl', '--status')):
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print('Existing security state:', command, 'exit:', result.returncode, result.stdout.strip(), flush=True)

          # Official Mac DMG: https://support.google.com/chrome/a/answer/12818048
          url = 'https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg'
          def official_url(value):
              parsed = urllib.parse.urlsplit(value)
              assert parsed.scheme == 'https' and parsed.netloc == 'dl.google.com', 'Non-official download origin'
              assert not parsed.fragment and not parsed.query, 'Unexpected download URL parameters'
              assert parsed.path.endswith('/googlechrome.dmg'), 'Unexpected download resource'
              return value

          class OfficialRedirect(urllib.request.HTTPRedirectHandler):
              max_redirections = 3
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  official_url(newurl)  # Reject before any follow-up request.
                  print('Official redirect:', newurl, flush=True)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          runner_temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert runner_temp.is_absolute() and runner_temp.is_dir(), 'Missing runner temporary directory'
          staging = runner_temp / 'slc-official-chrome'
          staging.mkdir(mode=0o700)  # Fail if present; never reuse or overwrite a previous candidate.
          dmg = staging / 'googlechrome.dmg'
          mount = staging / 'mount'
          mount.mkdir()
          digest = hashlib.sha256()
          size = 0
          print('Official download:', official_url(url), flush=True)
          opener = urllib.request.build_opener(OfficialRedirect())
          with opener.open(url, timeout=120) as response, dmg.open('xb') as target:
              official_url(response.geturl())
              assert response.status == 200, 'Unexpected download status'
              print('Final download URL:', response.geturl(), flush=True)
              while chunk := response.read(1024 * 1024):
                  size += len(chunk)
                  assert size <= 1024 * 1024 * 1024, 'DMG exceeds bounded download size'
                  digest.update(chunk)
                  target.write(chunk)
          assert size > 0, 'Empty DMG'
          print('DMG SHA256:', digest.hexdigest(), '; bytes:', size, flush=True)
          print(output('/usr/bin/hdiutil', 'verify', str(dmg)), flush=True)

          def verify_bundle(bundle):
              binary = bundle / 'Contents/MacOS/Google Chrome'
              assert bundle.resolve(strict=True) == bundle, 'Unexpected Chrome bundle symlink'
              assert binary.resolve(strict=True) == binary and binary.is_file(), 'Unexpected Chrome executable path'
              assert os.access(binary, os.X_OK), 'Official Chrome is not executable'
              # Homebrew casks may belong to the ephemeral runner, rather than root. Reject other owners
              # and group/world-writable bundle members. Internal framework symlinks must stay in the bundle.
              trusted_owners = {0, os.getuid()}
              count = 0
              for path in (bundle, *bundle.rglob('*')):
                  info = path.lstat()
                  if stat.S_ISLNK(info.st_mode):
                      target = path.resolve(strict=True)
                      assert target.is_relative_to(bundle), f'Chrome symlink escapes bundle: {path}'
                      continue
                  assert stat.S_ISREG(info.st_mode) or stat.S_ISDIR(info.st_mode), f'Unexpected Chrome member: {path}'
                  assert info.st_uid in trusted_owners and not info.st_mode & 0o022, f'Untrusted Chrome member: {path} uid={info.st_uid} mode={oct(stat.S_IMODE(info.st_mode))}'
                  count += 1
              print('Checked bundle members:', count, '; allowed owners:', sorted(trusted_owners), flush=True)
              requirement = 'anchor apple generic and identifier "com.google.Chrome" and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "EQHXZ8M8AV"'
              print(output('/usr/bin/codesign', '--verify', '--deep', '--strict', '--verbose=2', '-R', '=' + requirement, str(bundle)), flush=True)
              print(output('/usr/bin/codesign', '--display', '--verbose=4', str(bundle)), flush=True)
              with (bundle / 'Contents/Info.plist').open('rb') as stream:
                  metadata = plistlib.load(stream)
              assert metadata['CFBundleIdentifier'] == 'com.google.Chrome', 'Unexpected Chrome bundle identifier'
              return metadata

          def file_digest(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  while chunk := stream.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          # These are the only app objects inspected. Never traverse arbitrary runner files.
          components = (
              '.',
              'Contents/Frameworks/Google Chrome Framework.framework/Versions/Current/Helpers/app_mode_loader',
              'Contents/Frameworks/Google Chrome Framework.framework/Versions/Current/Helpers/Google Chrome Helper (GPU).app',
          )
          def diagnostic_error(relative, stage, error):
              # Avoid parser payloads and arbitrary filenames in exception strings.
              detail = {'type': type(error).__name__, 'errno': getattr(error, 'errno', None)}
              if isinstance(error, OSError):
                  detail['reason'] = error.strerror
              print('Diagnostic unavailable:', relative, stage, json.dumps(detail), flush=True)

          def diagnostic_command(relative, stage, args):
              try:
                  result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=20)
              except (OSError, subprocess.TimeoutExpired) as error:
                  diagnostic_error(relative, stage, error)
                  return None
              if result.returncode:
                  # Never emit captured stdout (it may be attribute values), or arbitrary stderr.
                  # Preserve exit, errno and recognized original error phrases, plus a digest.
                  message = result.stderr.decode('utf-8', errors='replace')
                  reasons = re.findall(r'(?i)no such (?:file(?: or directory)?|xattr)|permission denied|operation not permitted|not supported|invalid argument', message)
                  errnos = re.findall(r'\[Errno ([0-9]+)\]', message)
                  print('Diagnostic command failed:', relative, stage, '; exit:', result.returncode,
                        '; reasons:', json.dumps(reasons), '; errno:', json.dumps(errnos),
                        '; stderr bytes:', len(result.stderr),
                        '; stderr sha256:', hashlib.sha256(result.stderr).hexdigest(), flush=True)
                  return None
              return result.stdout, result.stderr

          def attribute_summary(target, relative):
              # Apple file_cmds/xattr/xattr.1: no mode lists names; -p -x reads hex.
              # No -l/-r/-v, write/delete/clear mode, shell, or Python Linux-only xattr API.
              result = diagnostic_command(relative, 'attribute names', ('/usr/bin/xattr', str(target)))
              if result is None:
                  return
              try:
                  names = result[0].decode('utf-8').splitlines()
              except UnicodeError as error:
                  diagnostic_error(relative, 'attribute names decode', error)
                  return
              print('Attributes:', relative, '; count:', len(names), flush=True)
              for name in sorted(set(names)):
                  if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.:#-]{0,254}', name):
                      print('Attribute name rejected:', relative, '; name sha256:',
                            hashlib.sha256(name.encode('utf-8')).hexdigest(), flush=True)
                      continue
                  result = diagnostic_command(relative, 'attribute read ' + name,
                                              ('/usr/bin/xattr', '-p', '-x', name, str(target)))
                  if result is None:
                      continue
                  try:
                      value = bytes.fromhex(result[0].decode('ascii'))
                      print('Attribute:', relative, json.dumps(name), '; length:', len(value),
                            '; sha256:', hashlib.sha256(value).hexdigest(), flush=True)
                  except (UnicodeError, ValueError) as error:
                      diagnostic_error(relative, 'attribute hex decode ' + name, error)

          def diagnostics(source, phase):
              print('DIAGNOSTICS:', phase, flush=True)
              for relative in components:
                  target = source / relative
                  try:
                      resolved = target.resolve(strict=True)
                      assert resolved.is_relative_to(source), 'Diagnostic path escapes candidate'
                      info = target.lstat()
                      assert stat.S_ISREG(info.st_mode) or stat.S_ISDIR(info.st_mode), 'Unexpected diagnostic object'
                      print('Object:', relative, '; resolved:', str(resolved.relative_to(source)),
                            '; mode:', oct(stat.S_IMODE(info.st_mode)), '; uid:', info.st_uid,
                            '; gid:', info.st_gid, '; size:', info.st_size, flush=True)
                  except Exception as error:
                      diagnostic_error(relative, 'object boundary', error)
                      continue  # Invalid paths must never reach any command or resource read.
                  try:
                      attribute_summary(target, relative)
                  except Exception as error:
                      diagnostic_error(relative, 'attributes', error)
                  if stat.S_ISDIR(info.st_mode):
                      for child in ('Contents/Info.plist', 'Contents/_CodeSignature/CodeResources'):
                          try:
                              item = target / child
                              if not item.exists():
                                  print('Missing:', relative, child, flush=True)
                                  continue
                              assert item.resolve(strict=True).is_relative_to(source), 'Diagnostic resource escapes candidate'
                              assert item.is_file(), 'Expected diagnostic regular file'
                              print('Resource:', relative, child, '; size:', item.stat().st_size,
                                    '; sha256:', file_digest(item), flush=True)
                              if child.endswith('Info.plist'):
                                  with item.open('rb') as stream:
                                      metadata = plistlib.load(stream)
                                  print('Plist:', relative, json.dumps({key: metadata.get(key) for key in
                                        ('CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion')}), flush=True)
                          except Exception as error:
                              diagnostic_error(relative, child, error)
                  try:
                      result = diagnostic_command(relative, 'signature display',
                                                  ('/usr/bin/codesign', '--display', '--verbose=4', str(target)))
                      if result is not None:
                          print('Signature display:', relative, '; exit: 0', flush=True)
                          # Successful display metadata only; no entitlements or certificates.
                          for line in (result[0] + result[1]).decode('utf-8', errors='replace').splitlines():
                              if line.startswith(('Identifier=', 'Format=', 'CodeDirectory ', 'Authority=',
                                                  'TeamIdentifier=', 'Sealed Resources ', 'Signature=')):
                                  print(line, flush=True)
                  except Exception as error:
                      diagnostic_error(relative, 'signature display', error)

          def mount_state(mount):
              assert mount.resolve(strict=True) == mount and os.path.ismount(mount), 'Unexpected diagnostic mount point'
              # Standard statvfs flags, not undocumented diskutil plist key guesses.
              # https://docs.python.org/3/library/os.html#os.statvfs
              try:
                  flag = os.statvfs(mount).f_flag
                  readonly = getattr(os, 'ST_RDONLY', None)
                  if type(flag) is not int or flag < 0 or type(readonly) is not int or readonly <= 0:
                      return 'unknown'
                  return 'readonly' if flag & readonly else 'not_readonly'
              except (OSError, AttributeError) as error:
                  print('Mount observation unavailable:', type(error).__name__, flush=True)
                  return 'unknown'

          def shadow_state(image):
              # Missing/null/false fields do not prove absence under an undocumented schema.
              values = [image.get(key) for key in ('shadow-path', 'shadow')]
              return 'present' if any(value is True or (isinstance(value, str) and value) for value in values) else 'unknown'

          print('codesign SHA256:', file_digest(pathlib.Path('/usr/bin/codesign')), flush=True)
          print('OS build:', output('/usr/bin/sw_vers', '-buildVersion'), flush=True)
          # No installer, copying, package repair or browser execution in this diagnostic run.
          print(output('/usr/bin/hdiutil', 'attach', '-readonly', '-nobrowse', '-noautoopen', '-mountpoint', str(mount), str(dmg)), flush=True)
          try:
              disk = plistlib.loads(subprocess.check_output(('/usr/sbin/diskutil', 'info', '-plist', str(mount))))
              print('Candidate mount:', json.dumps({key: disk.get(key) for key in
                    ('FilesystemType', 'FilesystemName', 'ReadOnlyMedia', 'ReadOnlyVolume', 'MountPoint')}), flush=True)
              readonly = mount_state(mount)
              print('Candidate statvfs readonly state:', readonly, flush=True)
              assert readonly != 'not_readonly', 'Diagnostic mount is explicitly not read-only'
              # Unknown permits read-only diagnostics, never browser execution or acceptance.
              images = plistlib.loads(subprocess.check_output(('/usr/bin/hdiutil', 'info', '-plist')))
              matching = [item for item in images.get('images', []) if item.get('image-path') == str(dmg)]
              assert len(matching) == 1, 'Candidate image metadata missing or ambiguous'
              image = matching[0]
              shadow = shadow_state(image)
              print('Candidate image:', json.dumps({'image-type': image.get('image-type'),
                    'writeable': image.get('writeable'), 'shadow-state': shadow}), flush=True)
              assert shadow != 'present', 'Unexpected shadow image'
              source = mount / 'Google Chrome.app'
              diagnostics(source, 'before strict verification')
              try:
                  verify_bundle(source)  # Original strict guard and Google identity remain mandatory.
              finally:
                  diagnostics(source, 'after strict verification')
          finally:
              # A detach failure must not mask the original strict-verification failure.
              try:
                  result = subprocess.run(('/usr/bin/hdiutil', 'detach', str(mount)),
                                          text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print('Candidate detach exit:', result.returncode, result.stdout.strip(), flush=True)
              except OSError as error:
                  print('Candidate detach unavailable:', type(error).__name__, flush=True)
          raise RuntimeError('Diagnostic-only run: browser execution and acceptance intentionally prohibited')
          PYTHON
      - name: Save diagnostic evidence (not browser results)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostic-evidence
          path: frontend/browser-results/
          if-no-files-found: error
          retention-days: 14
