# Branch-only diagnostic entry. Never merge this replacement into main.
# Before dispatch, independently approve and verify the exact remote tooling commit.
name: PR224 static PKG evidence only
on:
  workflow_dispatch:
    inputs:
      source_head:
        required: true
        type: string
        default: 'c731b4be1feb1d0d5b30efaf46a3ed56e4d13640'
      tooling_head:
        description: Independently reviewed remote diagnostic commit (not authorization)
        required: true
        type: string
      approval:
        description: static-only-no-install-no-launch (not authorization)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr224-static-package-inspection
  cancel-in-progress: false
jobs:
  inspection:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Wang106/SoftwareLifeCycle' &&
      github.ref == 'refs/heads/diagnostics/pr224-pkg-inspection' &&
      github.workflow_ref == 'Wang106/SoftwareLifeCycle/.github/workflows/browser-diagnostics.yml@refs/heads/diagnostics/pr224-pkg-inspection' &&
      github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c731b4be1feb1d0d5b30efaf46a3ed56e4d13640
          path: source
          persist-credentials: false
      - name: Validate source and tooling consistency, not approval
        id: scope
        run: python3 -I tooling/scripts/ci/validate_pr224_pkg_inspection.py
      - name: Static package inspection only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkg-inspection-evidence
          python3 -I source/scripts/ci/inspect_pkg_candidate.py | tee pkg-inspection-evidence/static-observation.txt
      - name: Save text evidence only
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr224-static-inspection-not-acceptance
          path: pkg-inspection-evidence/static-observation.txt
          if-no-files-found: error
          retention-days: 14
