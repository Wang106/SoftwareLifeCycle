# Branch-only diagnostic entry. Never merge this replacement into main.
# Before dispatch, independently approve and verify the exact remote tooling commit.
name: Main239 static PKG evidence only
on:
  workflow_dispatch:
    inputs:
      source_head:
        required: true
        type: string
        default: '87758ea9c5d237fa94bec3affad31d03721bf0a2'
      tooling_head:
        description: Independently reviewed remote diagnostic commit (not authorization)
        required: true
        type: string
      approval:
        description: static-only-no-install-no-launch (not authorization)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: main239-static-package-inspection
  cancel-in-progress: false
jobs:
  inspection:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Wang106/SoftwareLifeCycle' &&
      github.ref == 'refs/heads/diagnostics/main239-pkg-inspection' &&
      github.workflow_ref == 'Wang106/SoftwareLifeCycle/.github/workflows/browser-diagnostics.yml@refs/heads/diagnostics/main239-pkg-inspection' &&
      github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 87758ea9c5d237fa94bec3affad31d03721bf0a2
          path: source
          persist-credentials: false
      - name: Validate source and tooling consistency, not approval
        id: scope
        run: python3 -I tooling/scripts/ci/validate_main239_pkg_inspection.py
      - name: Static package inspection only
        shell: bash
        run: |
          set -euo pipefail
          python3 -I source/scripts/ci/inspect_pkg_candidate.py
