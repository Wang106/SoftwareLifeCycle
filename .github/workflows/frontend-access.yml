name: Read-only frontend access

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Approved SoftwareLifeCycle production or Preview HTTPS origin
        required: true
        default: https://softwarelifecycle.whf969.com
        type: string

permissions:
  contents: read

jobs:
  access:
    name: Frontend HTTP and bilingual SSR access
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check approved public frontend without credentials or writes
        env:
          FRONTEND_ORIGIN: ${{ inputs.origin }}
        run: python scripts/check_frontend.py "$FRONTEND_ORIGIN" --output ci-results/frontend-access.json
      - name: Save pass or failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-access-evidence
          path: ci-results/frontend-access.json
          if-no-files-found: error
          retention-days: 14
