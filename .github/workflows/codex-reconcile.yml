name: Codex development continuation

on:
  workflow_run:
    workflows: ['SoftwareLifeCycle CI', 'Codex development dispatcher']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: softwarelifecycle-codex-wakeup
  cancel-in-progress: false

jobs:
  wake:
    if: >-
      github.repository == 'Wang106/SoftwareLifeCycle' &&
      vars.CODEX_AUTODEV_ENABLED == 'true' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'codex/auto/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout or execution of code/artifacts from the triggering workflow.
      - name: Wake trusted main dispatcher when work or CI completed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          # Dispatcher wakes itself only when it actually launched a worker;
          # disabled/idle/dry-run ticks must not form an infinite event loop.
          if os.environ['SOURCE_NAME'] == 'Codex development dispatcher':
              url = root + '/actions/runs/' + os.environ['SOURCE_RUN_ID'] + '/jobs?per_page=100'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  jobs = json.load(response)['jobs']
              if not any('codex' in job['name'].lower() and job['conclusion'] != 'skipped' for job in jobs):
                  raise SystemExit(0)
          data = json.dumps({'ref': 'main', 'inputs': {'dry_run': False}}).encode()
          url = root + '/actions/workflows/codex-dispatch.yml/dispatches'
          with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers, method='POST'), timeout=30):
              pass
          PY
