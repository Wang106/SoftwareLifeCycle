name: Codex bounded development worker

on:
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      control_sha:
        required: true
        type: string
      work_sha:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      CODEX_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  codex:
    if: github.repository == 'Wang106/SoftwareLifeCycle' && github.ref == 'refs/heads/main' && vars.CODEX_DEVELOPMENT_MODE == 'api'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      candidate: ${{ steps.codex.outputs.final-message }}
    env:
      TASK_ID: ${{ inputs.task_id }}
      WORK_SHA: ${{ inputs.work_sha }}
      NEXT_TELEMETRY_DISABLED: '1'
      API_BASE_URL: ''
      NEXT_PUBLIC_API_BASE_URL: ''
      NEXT_PUBLIC_API_URL: ''
      AUTH_MODE: disabled
      READ_ONLY_MODE: 'true'
      SEED_ON_STARTUP: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.work_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies from trusted control checkout
        run: |
          python -m pip install -r control/backend/requirements-dev.txt
          npm ci --ignore-scripts --prefix control/frontend
          cp -a control/frontend/node_modules candidate/frontend/node_modules
      - name: Prepare bounded prompt
        env:
          PROMPT_PATH: ${{ github.workspace }}/codex-prompt.md
          GH_TOKEN: ${{ github.token }}
        run: python control/scripts/automation/prepare.py
      # Last step: no token-bearing publishing/upload commands run in this runner.
      - name: Execute one bounded task
        id: codex
        timeout-minutes: 30
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.162.1'
          prompt-file: ${{ github.workspace }}/codex-prompt.md
          working-directory: ${{ github.workspace }}/candidate
          output-schema-file: ${{ github.workspace }}/control/.github/codex/output.schema.json
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-bots: true

  publish:
    needs: codex
    if: needs.codex.result == 'success' && needs.codex.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.work_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: Wang106
          repositories: SoftwareLifeCycle
      - name: Validate data-only patch and publish without executing candidate code
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CANDIDATE_JSON: ${{ needs.codex.outputs.candidate }}
          TASK_ID: ${{ inputs.task_id }}
          WORK_SHA: ${{ inputs.work_sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: python control/scripts/automation/publish.py
