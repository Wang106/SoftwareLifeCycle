name: Manual migration image empty database rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-migration-database-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Owned migration image and disposable PG only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Start shared 55-minute budget before checkout
        run: |
          python3 -c 'import os, time; open(os.environ["GITHUB_ENV"], "a").write("MIGRATION_REHEARSAL_STARTED_NS=" + str(time.monotonic_ns()) + "\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify synthetic contracts without Docker or database
        run: python3 -B -m unittest discover -s backend/tests -p test_offline_migration_database_rehearsal.py -v
      - name: Run separately approved isolated empty database migration
        # Separate approval covers pinned acquisition/build, temporary superuser
        # trust, network namespace sharing, original DDL and owned CID cleanup.
        run: python3 -B scripts/offline_migration_database_rehearsal.py --run --expected-commit "$GITHUB_SHA"
      - name: Record blocked or uncertain result
        if: ${{ failure() || cancelled() }}
        run: echo 'Joint migration rehearsal blocked or uncertain; no retry, role isolation or company acceptance.' >> "$GITHUB_STEP_SUMMARY"
