name: SoftwareLifeCycle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, PostgreSQL and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slc_ci
          POSTGRES_PASSWORD: slc_ci_ephemeral
          POSTGRES_DB: software_lifecycle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slc_ci -d software_lifecycle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://slc_ci:slc_ci_ephemeral@127.0.0.1:5432/software_lifecycle_ci
      TEST_POSTGRES_URL: postgresql+psycopg://slc_ci:slc_ci_ephemeral@127.0.0.1:5432/software_lifecycle_ci
      AUTH_MODE: disabled
      READ_ONLY_MODE: "false"
      SEED_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install pinned backend requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Validate migration head, SQL and isolated PostgreSQL round trip
        run: python ../scripts/ci/check_migrations.py
      - name: Run complete backend suite with real PostgreSQL
        run: python -m pytest -q --junitxml=../ci-results/backend.xml
      - name: Reject skipped, failed or missing PostgreSQL tests
        if: ${{ !cancelled() }}
        run: python ../scripts/ci/check_backend_report.py ../ci-results/backend.xml
      - name: Save backend report and migration SQL
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: ci-results/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend tests and Cloudflare production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build without connecting to public staging or company data.
      API_BASE_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend lockfile
        run: npm ci
      - name: Validate production and Preview configuration
        run: npm run cf:check
      - name: Run frontend tests
        run: npm test
      - name: Build Next.js and OpenNext Cloudflare Worker
        run: npm run cf:build

  acceptance:
    name: CI acceptance
    needs: [backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require both validation jobs to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
