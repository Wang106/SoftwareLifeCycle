name: SoftwareLifeCycle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, PostgreSQL and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slc_ci
          POSTGRES_PASSWORD: slc_ci_ephemeral
          POSTGRES_DB: software_lifecycle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slc_ci -d software_lifecycle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://slc_ci:slc_ci_ephemeral@127.0.0.1:5432/software_lifecycle_ci
      TEST_POSTGRES_URL: postgresql+psycopg://slc_ci:slc_ci_ephemeral@127.0.0.1:5432/software_lifecycle_ci
      AUTH_MODE: disabled
      READ_ONLY_MODE: "false"
      SEED_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install pinned backend requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Verify development progress ledger
        run: python ../scripts/report_development_plan_progress.py --check
      - name: Verify Codex scheduler recovery and publication gates
        run: python -m unittest discover -s ../scripts/automation/tests -v
      - name: Validate migration head, SQL and isolated PostgreSQL round trip
        run: python ../scripts/ci/check_migrations.py
      - name: Run complete backend suite with real PostgreSQL
        run: python -m pytest -q --junitxml=../ci-results/backend.xml
      - name: Reject skipped, failed or missing PostgreSQL tests
        if: ${{ !cancelled() }}
        run: python ../scripts/ci/check_backend_report.py ../ci-results/backend.xml
      - name: Save backend report and migration SQL
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: ci-results/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend tests and Cloudflare production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build without connecting to public staging or company data.
      API_BASE_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend lockfile
        run: npm ci
      - name: Validate production and Preview configuration
        run: npm run cf:check
      - name: Run frontend tests
        run: npm test
      - name: Build Next.js and OpenNext Cloudflare Worker
        run: npm run cf:build
      - name: Verify disabled authentication routes and bilingual account SSR
        run: npm run auth:check

  browser:
    name: Isolated Chromium browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend lockfile
        run: npm ci
      - name: Verify existing official Chrome and unchanged sandbox policy
        shell: bash
        run: |
          mkdir -p browser-results
          python - <<'PYTHON' | tee browser-results/runner-browser.txt
          import os, pathlib, re, stat, subprocess
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          binary = pathlib.Path('/opt/google/chrome/chrome')
          profile = pathlib.Path('/etc/apparmor.d/chrome')
          for path in (binary, profile):
              assert path.resolve() == path, f'Unexpected symlink: {path}'
              info = path.stat()
              assert stat.S_ISREG(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022, f'Untrusted existing file: {path}'
          assert os.access(binary, os.X_OK), 'Official Chrome is not executable'
          package = output('dpkg-query', '-W', '-f=${Status}\t${Version}', 'google-chrome-stable')
          status, version = package.split('\t')
          assert status == 'install ok installed', 'Official Chrome package unavailable'
          assert output('dpkg-query', '-S', str(binary)) == f'google-chrome-stable: {binary}', 'Unexpected package owner'
          actual = output(str(binary), '--version')
          assert re.search(r'\b' + re.escape(version.rsplit('-', 1)[0]) + r'\b', actual), 'Package/binary version mismatch'
          policy = profile.read_text()
          assert str(binary) in policy and re.search(r'\buserns\s*,', policy), 'Expected existing Chrome profile unavailable'
          enabled = pathlib.Path('/sys/module/apparmor/parameters/enabled').read_text().strip()
          assert enabled == 'Y', 'AppArmor enabled evidence unavailable'
          print('Runner image:', os.environ.get('ImageOS', 'unknown'), os.environ.get('ImageVersion', 'unknown'))
          print('Channel: chrome; chromiumSandbox: true; retries: 0')
          print('Package:', version, '; binary:', actual, '; path:', binary)
          print('Existing root-owned profile:', profile, '; AppArmor enabled:', enabled)
          print('Profile presence is not proof of loaded policy or successful sandbox; actual browser tests remain mandatory.')
          PYTHON
      - name: Build isolated production app
        run: npm run build
      - name: Run real-browser synthetic read-only journey
        run: npm run test:browser
      - name: Save synthetic browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: frontend/browser-results/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: CI acceptance
    needs: [backend, frontend, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all validation jobs to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BROWSER_RESULT" = success
