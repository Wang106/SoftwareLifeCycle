name: SoftwareLifeCycle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, PostgreSQL and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slc_ci
          POSTGRES_PASSWORD: slc_ci_ephemeral
          POSTGRES_DB: software_lifecycle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slc_ci -d software_lifecycle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://slc_ci:slc_ci_ephemeral@127.0.0.1:5432/software_lifecycle_ci
      TEST_POSTGRES_URL: postgresql+psycopg://slc_ci:slc_ci_ephemeral@127.0.0.1:5432/software_lifecycle_ci
      AUTH_MODE: disabled
      READ_ONLY_MODE: "false"
      SEED_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install pinned backend requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Verify development progress ledger
        run: python ../scripts/report_development_plan_progress.py --check
      - name: Verify Codex scheduler recovery and publication gates
        run: python -m unittest discover -s ../scripts/automation/tests -v
      - name: Validate migration head, SQL and isolated PostgreSQL round trip
        run: python ../scripts/ci/check_migrations.py
      - name: Run complete backend suite with real PostgreSQL
        run: python -m pytest -q --junitxml=../ci-results/backend.xml
      - name: Reject skipped, failed or missing PostgreSQL tests
        if: ${{ !cancelled() }}
        run: python ../scripts/ci/check_backend_report.py ../ci-results/backend.xml
      - name: Save backend report and migration SQL
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: ci-results/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend tests and Cloudflare production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build without connecting to public staging or company data.
      API_BASE_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend lockfile
        run: npm ci
      - name: Validate production and Preview configuration
        run: npm run cf:check
      - name: Run frontend tests
        run: npm test
      - name: Build Next.js and OpenNext Cloudflare Worker
        run: npm run cf:build
      - name: Verify disabled authentication routes and bilingual account SSR
        run: npm run auth:check

  browser:
    name: Isolated Chromium browser journey
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend lockfile
        run: npm ci
      - name: Verify isolated official Chrome and unchanged sandbox policy
        shell: bash
        run: |
          mkdir -p browser-results
          python3 - <<'PYTHON' | tee browser-results/runner-browser.txt
          import hashlib, os, pathlib, platform, plistlib, stat, subprocess, urllib.parse, urllib.request

          def output(*args):
              try:
                  return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT).strip()
              except subprocess.CalledProcessError as error:
                  print(error.output or '', end='', flush=True)
                  raise

          assert platform.system() == 'Darwin' and platform.machine() == 'arm64', 'Expected macOS ARM64 runner'
          print('Runner image:', os.environ.get('ImageOS', 'unknown'), os.environ.get('ImageVersion', 'unknown'), flush=True)
          print('OS:', output('/usr/bin/sw_vers', '-productVersion'), '; architecture:', platform.machine(), flush=True)
          # Observe only. Hosted-runner SIP/Gatekeeper state is not modified or mistaken for sandbox proof.
          for command in (('/usr/bin/csrutil', 'status'), ('/usr/sbin/spctl', '--status')):
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print('Existing security state:', command, 'exit:', result.returncode, result.stdout.strip(), flush=True)

          # Official Mac DMG: https://support.google.com/chrome/a/answer/12818048
          url = 'https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg'
          def official_url(value):
              parsed = urllib.parse.urlsplit(value)
              assert parsed.scheme == 'https' and parsed.netloc == 'dl.google.com', 'Non-official download origin'
              assert not parsed.fragment and not parsed.query, 'Unexpected download URL parameters'
              assert parsed.path.endswith('/googlechrome.dmg'), 'Unexpected download resource'
              return value

          class OfficialRedirect(urllib.request.HTTPRedirectHandler):
              max_redirections = 3
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  official_url(newurl)  # Reject before any follow-up request.
                  print('Official redirect:', newurl, flush=True)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          runner_temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert runner_temp.is_absolute() and runner_temp.is_dir(), 'Missing runner temporary directory'
          staging = runner_temp / 'slc-official-chrome'
          staging.mkdir(mode=0o700)  # Fail if present; never reuse or overwrite a previous candidate.
          dmg = staging / 'googlechrome.dmg'
          mount = staging / 'mount'
          mount.mkdir()
          digest = hashlib.sha256()
          size = 0
          print('Official download:', official_url(url), flush=True)
          opener = urllib.request.build_opener(OfficialRedirect())
          with opener.open(url, timeout=120) as response, dmg.open('xb') as target:
              official_url(response.geturl())
              assert response.status == 200, 'Unexpected download status'
              print('Final download URL:', response.geturl(), flush=True)
              while chunk := response.read(1024 * 1024):
                  size += len(chunk)
                  assert size <= 1024 * 1024 * 1024, 'DMG exceeds bounded download size'
                  digest.update(chunk)
                  target.write(chunk)
          assert size > 0, 'Empty DMG'
          print('DMG SHA256:', digest.hexdigest(), '; bytes:', size, flush=True)
          print(output('/usr/bin/hdiutil', 'verify', str(dmg)), flush=True)

          def verify_bundle(bundle):
              binary = bundle / 'Contents/MacOS/Google Chrome'
              assert bundle.resolve(strict=True) == bundle, 'Unexpected Chrome bundle symlink'
              assert binary.resolve(strict=True) == binary and binary.is_file(), 'Unexpected Chrome executable path'
              assert os.access(binary, os.X_OK), 'Official Chrome is not executable'
              # Homebrew casks may belong to the ephemeral runner, rather than root. Reject other owners
              # and group/world-writable bundle members. Internal framework symlinks must stay in the bundle.
              trusted_owners = {0, os.getuid()}
              count = 0
              for path in (bundle, *bundle.rglob('*')):
                  info = path.lstat()
                  if stat.S_ISLNK(info.st_mode):
                      target = path.resolve(strict=True)
                      assert target.is_relative_to(bundle), f'Chrome symlink escapes bundle: {path}'
                      continue
                  assert stat.S_ISREG(info.st_mode) or stat.S_ISDIR(info.st_mode), f'Unexpected Chrome member: {path}'
                  assert info.st_uid in trusted_owners and not info.st_mode & 0o022, f'Untrusted Chrome member: {path} uid={info.st_uid} mode={oct(stat.S_IMODE(info.st_mode))}'
                  count += 1
              print('Checked bundle members:', count, '; allowed owners:', sorted(trusted_owners), flush=True)
              requirement = 'anchor apple generic and identifier "com.google.Chrome" and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "EQHXZ8M8AV"'
              print(output('/usr/bin/codesign', '--verify', '--deep', '--strict', '--verbose=2', '-R', '=' + requirement, str(bundle)), flush=True)
              print(output('/usr/bin/codesign', '--display', '--verbose=4', str(bundle)), flush=True)
              with (bundle / 'Contents/Info.plist').open('rb') as stream:
                  metadata = plistlib.load(stream)
              assert metadata['CFBundleIdentifier'] == 'com.google.Chrome', 'Unexpected Chrome bundle identifier'
              return metadata

          # No installer runs. The source image is mounted read-only and never repaired.
          print(output('/usr/bin/hdiutil', 'attach', '-readonly', '-nobrowse', '-noautoopen', '-mountpoint', str(mount), str(dmg)), flush=True)
          try:
              source = mount / 'Google Chrome.app'
              source_metadata = verify_bundle(source)
              bundle = staging / 'Google Chrome.app'
              assert not bundle.exists(), 'Destination must be new'
              print(output('/usr/bin/ditto', '--rsrc', '--extattr', '--acl', str(source), str(bundle)), flush=True)
              metadata = verify_bundle(bundle)
              assert metadata == source_metadata, 'Copied bundle metadata differs'
          finally:
              print(output('/usr/bin/hdiutil', 'detach', str(mount)), flush=True)
          binary = bundle / 'Contents/MacOS/Google Chrome'
          configured_binary = output('node', '-e', "process.stdout.write(require('./e2e/playwright.config.cjs').use.launchOptions.executablePath)")
          assert configured_binary == str(binary), 'Guard and Playwright executable paths differ'
          version = metadata['CFBundleShortVersionString']
          actual = output(str(binary), '--version')
          assert actual == 'Google Chrome ' + version, 'Bundle/binary version mismatch'
          print('Candidate: isolated official Stable Chrome; chromiumSandbox: true; retries: 0', flush=True)
          print('Verified Google Developer ID; binary:', actual, '; path:', binary, flush=True)
          print('Signature and file checks are not runtime sandbox proof or production security acceptance.', flush=True)
          PYTHON
      - name: Build isolated production app
        run: npm run build
      - name: Run real-browser synthetic read-only journey
        run: npm run test:browser
      - name: Save synthetic browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: frontend/browser-results/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: CI acceptance
    needs: [backend, frontend, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all validation jobs to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BROWSER_RESULT" = success
