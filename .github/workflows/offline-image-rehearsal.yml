name: Manual offline image rehearsal

on:
  workflow_dispatch:
    inputs:
      export_bundle:
        description: Export and independently verify a temporary local bundle (no upload)
        type: boolean
        required: false
        default: false
      run_api_startup:
        description: Start this run's API image in an isolated container, without a database (separate runtime approval required)
        type: boolean
        required: false
        default: false
      run_web_startup:
        description: Start this run's Web image in a separate isolated container, without API/database integration (separate runtime approval required)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: offline-image-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Connected image preparation, not offline acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check existing host prerequisites before checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os, time; open(os.environ["GITHUB_ENV"], "a").write("REHEARSAL_STARTED_NS=" + str(time.monotonic_ns()) + "\n")'
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          docker --context default version
          docker --context default info --format '{{json .}}' > "$RUNNER_TEMP/slc-docker-info.json"
          docker --context default compose version --short > "$RUNNER_TEMP/slc-compose-version.txt"
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, sys, tempfile
          assert sys.version_info[:2] == (3, 12), 'Existing Python 3.12 required; do not install'
          import pip
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          info = json.loads((root / 'slc-docker-info.json').read_text())
          version = (root / 'slc-compose-version.txt').read_text().strip()
          match = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)(?:[-+][a-zA-Z0-9.-]+)?', version)
          assert match and tuple(map(int, match.groups())) >= (2, 30, 0), 'Compose 2.30+ required'
          assert info['OSType'] == 'linux' and info['Architecture'] in ('amd64', 'x86_64')
          for location in (tempfile.gettempdir(), info['DockerRootDir']):
              free = shutil.disk_usage(location).free
              print('Existing filesystem free bytes:', free)
              assert free >= 20 * 1024**3, '20 GiB free required; do not reconfigure runner'
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify rehearsal contracts without Docker execution
        run: |
          python3 -m unittest discover -s backend/tests -p test_offline_image_rehearsal.py -v
          python3 -m unittest discover -s backend/tests -p test_offline_api_startup_rehearsal.py -v
          python3 -m unittest discover -s backend/tests -p test_offline_web_startup_rehearsal.py -v
          python3 -m unittest discover -s backend/tests -p test_offline_web_workflow.py -v
      - name: Build, validate and optionally smoke separate isolated API and Web processes
        shell: bash
        env:
          EXPORT_IMAGE_BUNDLE: ${{ inputs.export_bundle }}
          RUN_API_STARTUP: ${{ inputs.run_api_startup }}
          RUN_WEB_STARTUP: ${{ inputs.run_web_startup }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, math, os, pathlib, re, signal, subprocess, sys, tempfile, time, uuid
          sys.path.insert(0, 'scripts')
          import offline_image_bundle as bundle

          phase = 'input'
          try:
              def require(condition):
                  if not condition:
                      raise ValueError()

              root = pathlib.Path(os.environ['RUNNER_TEMP'])
              require(root.is_absolute() and root.is_dir())
              option = os.environ['EXPORT_IMAGE_BUNDLE']
              require(option in ('false', 'true'))
              startup = os.environ['RUN_API_STARTUP']
              require(startup in ('false', 'true'))
              web_startup = os.environ['RUN_WEB_STARTUP']
              require(web_startup in ('false', 'true'))
              # Runner-local timing bookkeeping, not authenticated provenance.
              # Linux monotonic_ns shares its clock across these job processes.
              stamp = os.environ['REHEARSAL_STARTED_NS']
              require(re.fullmatch('[1-9][0-9]{0,19}', stamp) is not None)
              started, now = int(stamp), time.monotonic_ns()
              require(0 <= now - started < 3300 * 10**9)
              deadline = started + 3300 * 10**9
              api_reserve = 240 if startup == 'true' else 0
              web_reserve = 240 if web_startup == 'true' else 0
              verify_reserve = 600 if option == 'true' else 0

              def remaining():
                  return (deadline - time.monotonic_ns()) / 10**9

              def allowance(cap, reserved=0):
                  available = remaining() - 30 - reserved
                  require(available > 0)
                  return min(cap, available)
              commit = os.environ['GITHUB_SHA']
              require(bundle.hexadecimal(commit, 40))

              def child(args, limit, timeout):
                  # Capture privately, bound parsing, and never publish child stderr.
                  # Only this newly created capture file is removed on close.
                  with tempfile.TemporaryFile(dir=root) as output:
                      subprocess.run(args, stdin=subprocess.DEVNULL, stdout=output,
                                     stderr=subprocess.DEVNULL, check=True, timeout=timeout)
                      output.seek(0)
                      raw = output.read(limit + 1)
                      require(len(raw) <= limit)
                      return raw

              def finite_float(value):
                  number = float(value)
                  require(math.isfinite(number))
                  return number

              def parse_json(raw):
                  # Reject exponent overflow during parsing, including ignored
                  # nested metadata, without a second recursive tree traversal.
                  return json.loads(raw, object_pairs_hook=bundle.preflight.object_pairs,
                                    parse_constant=finite_float, parse_float=finite_float)

              phase = 'checkout'
              require(child(['git', 'rev-parse', 'HEAD'], 41,
                            allowance(30, verify_reserve + api_reserve + web_reserve)) == (commit + '\n').encode())
              args = [sys.executable, 'scripts/offline_image_rehearsal.py', '--run']
              if option == 'true':
                  # The exporter exclusively creates this path. Collision is a failure,
                  # never an overwrite, retry, reuse or deletion of an existing path.
                  destination = root / ('slc-image-handoff-' + uuid.uuid4().hex)
                  require(not os.path.lexists(destination))
                  args += ['--export-bundle', str(destination)]

              phase = 'rehearsal'
              result = parse_json(child(args, 4 * 1024**2,
                                        allowance(3300, verify_reserve + api_reserve + web_reserve)))
              phase = 'receipt'
              fields = {'status', 'source_commit', 'host', 'bases', 'dependencies', 'images',
                        'source_sha256', 'compose', 'native_smoke', 'limitations'}
              require(type(result) is dict and set(result) == fields | ({'image_bundle'} if option == 'true' else set()))
              require(bundle.exact(result['status'], bundle.REHEARSAL_STATUS)
                      and bundle.exact(result['source_commit'], commit))
              require(bundle.exact(result['compose'], {'status': 'COMPOSE_PARSED_ONLY',
                      'operator_approval': False, 'application_started': False}))
              native = result['native_smoke']
              require(type(native) is dict and set(native) == {'api', 'web'}
                      and all(type(value) is str and bool(value) for value in native.values()))
              images = result['images']
              require(type(images) is dict and set(images) == {'api', 'web'})
              for role in ('api', 'web'):
                  item = images[role]
                  require(type(item) is dict and set(item) == {'archive', 'size', 'sha256', 'image_id', 'platform', 'source_commit'})
                  require(bundle.exact(item['archive'], role + '.tar')
                          and bundle.exact(item['source_commit'], commit)
                          and bundle.exact(item['platform'], 'linux/amd64')
                          and type(item['size']) is int and item['size'] > 0
                          and bundle.hexadecimal(item['sha256'], 64)
                          and type(item['image_id']) is str and item['image_id'].startswith('sha256:')
                          and bundle.hexadecimal(item['image_id'][7:], 64))
              if option == 'true':
                  # Reconstruct from the trusted run result, never read expectations
                  # from the exported directory. Also bind the receipt to these images.
                  manifest, _ = bundle.export_inputs({'format': 'slc-offline-readonly-v1',
                      'source_commit': commit, 'required_db_revision': bundle.preflight.REVISION,
                      'images': images}, result)
                  digest = hashlib.sha256(bundle.canonical(manifest)).hexdigest()
                  receipt = result['image_bundle']
                  require(bundle.exact(receipt, {'status': 'IMAGE_BUNDLE_EXPORTED_NOT_OFFLINE_ACCEPTANCE',
                          'source_commit': commit, 'manifest_sha256': digest}))
                  phase = 'verification'
                  verified = parse_json(child([sys.executable, 'scripts/offline_image_bundle.py',
                      'verify', str(destination), '--expected-commit', receipt['source_commit'],
                      '--expected-manifest-sha256', receipt['manifest_sha256']], 64 * 1024,
                      allowance(600, api_reserve + web_reserve)))
                  require(bundle.exact(verified, {'status': 'IMAGE_BUNDLE_VERIFIED_NOT_OFFLINE_ACCEPTANCE',
                          'source_commit': commit, 'manifest_sha256': digest}))

              if startup == 'true':
                  phase = 'api_startup'
                  # Do not give a child subprocess a hard-kill timeout that bypasses
                  # the API script's 180-second work / 35-second owned-CID cleanup.
                  # Budget the full window before creating any new container.
                  require(remaining() >= 240 + web_reserve + 30)
                  import offline_api_startup_rehearsal as api
                  previous = signal.getsignal(signal.SIGTERM)
                  def interrupted(_signum, _frame):
                      raise KeyboardInterrupt()
                  try:
                      signal.signal(signal.SIGTERM, interrupted)
                      require(remaining() >= 240 + web_reserve + 30)
                      outcome = api.run_rehearsal(images['api']['image_id'], commit)
                  finally:
                      signal.signal(signal.SIGTERM, previous)
                  require(type(outcome) is tuple and len(outcome) == 2)
                  api_receipt, api_code = outcome
                  require(type(api_code) is int and api_code == 0)
                  require(bundle.exact(api_receipt, {
                      'status': 'API_PROCESS_SMOKE_PASSED_DATABASE_NOT_READY',
                      'phase': 'FINAL_PROCESS', 'cases_passed': 10, 'cases_total': 10,
                      'container_removed': True, 'limitations': api.LIMITATIONS,
                      'image_id': images['api']['image_id'], 'source_commit': commit,
                      'database_ready': False,
                      'provenance': 'caller_supplied_trusted_build_consistency_only'}))

              if web_startup == 'true':
                  phase = 'web_startup'
                  # A separate opt-in, not implied by the API option. Use only
                  # this successful build's ID and source, after API removal if
                  # requested. No live API is shared with the Web container.
                  # Keep the full 180-second work / 35-second owned cleanup
                  # window; never hard-kill a wrapper around container custody.
                  require(remaining() >= 240 + 30)
                  import offline_web_startup_rehearsal as web
                  previous = signal.getsignal(signal.SIGTERM)
                  def web_interrupted(_signum, _frame):
                      raise KeyboardInterrupt()
                  try:
                      signal.signal(signal.SIGTERM, web_interrupted)
                      require(remaining() >= 240 + 30)
                      outcome = web.run_rehearsal(images['web']['image_id'], commit)
                  finally:
                      signal.signal(signal.SIGTERM, previous)
                  require(type(outcome) is tuple and len(outcome) == 2)
                  web_receipt, web_code = outcome
                  require(type(web_code) is int and web_code == 0)
                  require(bundle.exact(web_receipt, {
                      'status': 'WEB_STARTUP_SSR_PASSED_NOT_BROWSER_OR_OFFLINE_ACCEPTANCE',
                      'phase': 'FINAL_PROCESS', 'cases_passed': 2, 'cases_total': 2,
                      'evidence_kind': 'runtime_attempt', 'container_removed': True,
                      'limitations': web.LIMITATIONS,
                      'image_id': images['web']['image_id'], 'source_commit': commit,
                      'database_ready': False, 'api_integration': False,
                      'browser_hydration': False, 'offline_acceptance': False,
                      'provenance': 'caller_supplied_trusted_build_consistency_only'}))

              phase = 'summary'
              require(remaining() >= 30)
              text = '## Connected image rehearsal\n\n' + bundle.REHEARSAL_STATUS + '\n\nSource: ' + commit + '\n\n'
              for role in ('api', 'web'):
                  text += role + ': ' + images[role]['image_id'] + ', archive SHA256 ' + images[role]['sha256'] + '\n\n'
              if option == 'true':
                  text += ('IMAGE_BUNDLE_VERIFIED_NOT_OFFLINE_ACCEPTANCE\n\nManifest SHA256: ' + digest + '\n\n'
                           'Export and independent verification passed on this temporary runner only. '
                           'No artifact upload or retained downloadable bundle.\n\n')
              else:
                  text += 'Optional image bundle export and verification not requested.\n\n'
              if startup == 'true':
                  text += ('API_PROCESS_SMOKE_PASSED_DATABASE_NOT_READY\n\n'
                           'API process probes: 10/10; container_removed=true; database_ready=false. '
                           'This run\'s temporary, isolated API container was started and removed.\n\n')
              else:
                  text += 'API process startup not requested.\n\n'
              if web_startup == 'true':
                  text += ('WEB_STARTUP_SSR_PASSED_NOT_BROWSER_OR_OFFLINE_ACCEPTANCE\n\n'
                           'Web server HTML and disabled-login probes: 2/2; container_removed=true; '
                           'database_ready=false; api_integration=false; browser_hydration=false; offline_acceptance=false. '
                           'This run\'s separate, isolated Web container was started and removed. '
                           'These sequential smokes are not a Web/API/database integration.\n\n')
              else:
                  text += 'Web process startup not requested.\n\n'
              if startup == 'true' or web_startup == 'true':
                  text += ('No physical network isolation, no database startup, migration, seed or real '
                           'authentication, no browser or company deployment acceptance.\n')
              else:
                  text += ('No physical network isolation, no application/DB startup, no operator/deployment approval '
                           'or company acceptance.\n')
              text += ('Integrity checks are not signatures, provenance authentication or '
                       'security/license clearance. No runtime approval is inferred from these results.\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(text)
          except (Exception, KeyboardInterrupt):
              print('BLOCKED: image rehearsal workflow phase=' + phase +
                    '; no offline or deployment acceptance. No export retry or cleanup attempted.', file=sys.stderr)
              raise SystemExit(2) from None
          PY
      - name: Record blocked or incomplete result
        if: ${{ failure() || cancelled() }}
        run: echo 'Image rehearsal blocked or incomplete. No offline, application, database or deployment acceptance.' >> "$GITHUB_STEP_SUMMARY"
